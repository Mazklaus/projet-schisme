# CI du projet Schisme (dépôt privé : les minutes Actions sont comptées, la CI reste légère).
# Sur chaque PR et sur main : vérification des décors, tests GUT, parcours complet de la démo.
# L'export Windows/Linux ne tourne qu'à la demande (workflow_dispatch) : les modèles d'export
# pèsent ~1 Go, et les builds restent des artefacts privés du dépôt (ne jamais les diffuser).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      exporter:
        description: "Exporter les builds Windows et Linux"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decors:
    name: Contrat des décors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - run: python3 tools/ci/verifier_decors.py .
      - run: python3 tools/ci/verifier_cles.py .
      - run: python3 tools/ci/verifier_sync_decors.py .
      - run: python3 tools/ci/verifier_bustes.py
      # Spec du système de choix (Game Designer) : nommage, canon, défauts minutés, règle 3.1.
      - run: python3 tools/ci/verif_choix.py data/dialogues/ep01 --registre data/personnages.json
      # Suivi de production (GD) : rapport par épisode dans le résumé de la CI et en artefact.
      # Liste de travail, non bloquante, sauf deux erreurs : calque 4k d'avant la retouche, décor « fini » sans capture.
      - name: Suivi de production des épisodes
        run: |
          pip install --quiet numpy
          python3 -m unittest discover -s tools/ci/tests
          mkdir -p suivi
          code=0
          for d in data/dialogues/ep*/; do
            ep=$(basename "$d")
            # historique du dépôt + ligne de ce build (non commitée : on la régénère en local avec --historique)
            cp "qa/historique_$ep.csv" "suivi/" 2>/dev/null || true
            python3 tools/ci/verifier_episode.py "$ep" --sortie "suivi/suivi_$ep.md" --historique "suivi/historique_$ep.csv" || code=1
            cat "suivi/suivi_$ep.md" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suivi-production
          path: suivi/
          retention-days: 14

  tests:
    name: Tests et parcours de la démo
    needs: decors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}
      - name: Installer Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
      - name: Import
        run: ~/godot/godot --headless --import
      - name: Tests GUT
        # GUT ignore en silence un script qui ne compile pas : on échoue explicitement.
        run: |
          set -o pipefail
          ~/godot/godot --headless -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json -gexit 2>&1 | tee gut.log
          if grep -E "SCRIPT ERROR|Failed to load script|Ignoring script" gut.log; then
            echo "::error::Un script ne compile pas (voir ci-dessus)"; exit 1
          fi
      - name: Parcours de la démo (3 branches du choix)
        run: |
          set -o pipefail
          for c in 0 1 attendre; do
            ~/godot/godot --headless -s res://tools/ci/parcours_demo.gd -- --choix=$c 2>&1 | tee parcours.log
            if grep -E "SCRIPT ERROR|^ERROR" parcours.log; then exit 1; fi
          done
      - name: Parcours de la tranche Ullanor (toutes les façons de finir, sauvegarde vérifiée)
        # Temps accéléré ×4. « flaner » vérifie la relance vox de Dremm à 30 s ; « immobile », l'invite
        # de déplacement et l'éboulement montré par la caméra au joueur qui ne bouge pas.
        run: |
          set -o pipefail
          for c in sortir auxiliaires obeir silence rassemblement inaction; do
            ~/godot/godot --headless -s res://tools/ci/parcours_ullanor.gd -- --choix=$c 2>&1 | tee ullanor.log
            if grep -E "SCRIPT ERROR|^ERROR" ullanor.log; then exit 1; fi
          done
          ~/godot/godot --headless -s res://tools/ci/parcours_ullanor.gd -- --choix=obeir --flaner --sans-poi 2>&1 | tee ullanor.log
          if grep -E "SCRIPT ERROR|^ERROR" ullanor.log; then exit 1; fi
          ~/godot/godot --headless -s res://tools/ci/parcours_ullanor.gd -- --choix=silence --immobile --sans-poi 2>&1 | tee ullanor.log
          if grep -E "SCRIPT ERROR|^ERROR" ullanor.log; then exit 1; fi
      - name: Parcours de l'épisode 1 (chapitres jouables, trois politiques, import de la tranche)
        run: |
          set -o pipefail
          # Valeurs attendues : Game Designer (etude-heresie/episode-01/attendus-qa-ch01-02.md).
          declare -A V
          V[premier]=choix_ep01_depart=1,choix_ep01_ullanor=1,choix_ep01_loge=1,vivant_ilse=true,connait_ilse_sauveur=true,connait_dremm_tunnel=false,relation_dremm=-1,relation_ilse=2,trait_vaskar_compassion=3,ep01_krenn_releve=true,ep01_plaque_gardee=true,choix_ep01_recit=1,choix_ep01_orvane=1,choix_ep01_nom=1,relation_sefa=3,connait_sefa_plaque=true
          V[dernier]=choix_ep01_depart=3,choix_ep01_ullanor=3,choix_ep01_loge=3,vivant_ilse=false,connait_ilse_sauveur=false,connait_dremm_tunnel=true,relation_dremm=0,relation_ilse=0,trait_vaskar_fraternite=1,trait_vaskar_doute=4,trait_vaskar_orgueil=1,trait_vaskar_obeissance=2,ep01_krenn_releve=false,ep01_plaque_gardee=false,choix_ep01_recit=3,choix_ep01_orvane=2,choix_ep01_nom=3,relation_sefa=-1,connait_sefa_plaque=false
          V[silence]=choix_ep01_depart=3,choix_ep01_ullanor=3,choix_ep01_loge=3,vivant_ilse=false,connait_ilse_sauveur=false,connait_dremm_tunnel=true,relation_dremm=2,relation_ilse=0,trait_vaskar_fraternite=2,trait_vaskar_doute=4,trait_vaskar_orgueil=1,trait_vaskar_obeissance=3,ep01_krenn_releve=false,ep01_plaque_gardee=false,choix_ep01_recit=3,choix_ep01_orvane=1,choix_ep01_nom=3,relation_sefa=-1,connait_sefa_plaque=false
          for p in premier dernier silence; do
            ~/godot/godot --headless -s res://tools/ci/parcours_episode.gd -- --episode=ep01 --politique=$p --vitesse=8 --valeurs=${V[$p]} 2>&1 | tee episode.log
            if grep -E "SCRIPT ERROR|^ERROR" episode.log; then exit 1; fi
          done
          # Sauvegarde de la tranche (emplacement 0), puis reprise au chapitre 2 de l'épisode 1.
          ~/godot/godot --headless -s res://tools/ci/parcours_ullanor.gd -- --choix=sortir 2>&1 | tee episode.log
          ~/godot/godot --headless -s res://tools/ci/parcours_episode.gd -- --episode=ep01 --chapitre=c02 --importer=0 --vitesse=8 --attendu=choix_ep01_ullanor,vivant_ilse,connait_ilse_sauveur,choix_ep01_loge 2>&1 | tee episode.log
          if grep -E "SCRIPT ERROR|^ERROR" episode.log; then exit 1; fi

  export:
    name: Export Windows et Linux
    if: github.event_name == 'workflow_dispatch' && inputs.exporter
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot et modèles d'export
        run: |
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp && mv /tmp/Godot_v${V}_linux.x86_64 /tmp/godot
          curl -fsSL -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          unzip -q -j /tmp/tpl.tpz "templates/linux_release.x86_64" "templates/windows_release_x86_64.exe" "templates/version.txt" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
      - name: Export
        run: |
          mkdir -p build/linux build/windows
          /tmp/godot --headless --import
          /tmp/godot --headless --export-release "Linux" build/linux/projet-schisme.x86_64
          /tmp/godot --headless --export-release "Windows" build/windows/projet-schisme.exe
      - uses: actions/upload-artifact@v4
        with:
          name: builds-prives
          path: build/
          retention-days: 7
